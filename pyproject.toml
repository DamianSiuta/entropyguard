[project]
name = "entropyguard"
version = "2.0.0"
description = "Local exact and semantic deduplication for text datasets (Polars + FAISS + sentence-transformers)."
authors = [{ name = "Damian Siuta" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "polars>=1.20,<3",
    "pyarrow>=15",
    "fastexcel>=0.11.6",
    "faiss-cpu>=1.9",
    "numpy>=2.0,<3",
    "pydantic>=2.5,<3",
    "sentence-transformers>=3.0",
    "xxhash>=3.4",
    "tqdm>=4.66",
    "psutil>=5.9",
]

[project.optional-dependencies]
pdf = ["docling>=2.0"]

[project.scripts]
entropyguard = "entropyguard.cli.main:main"

[project.urls]
Repository = "https://github.com/DamianSiuta/entropyguard"

[tool.poetry]
packages = [{ include = "entropyguard", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"
mypy = ">=1.10"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/entropyguard --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

[tool.ruff.lint]
select = ["F", "E9"]
